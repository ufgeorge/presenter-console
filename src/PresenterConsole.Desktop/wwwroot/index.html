<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest?v=19">
  <link rel="stylesheet" href="app.css?v=19">
  <title>Presenter Console</title>
</head>
<body><main>
  <header class="status-bar">
    <div class="status-summary">
      <p id="status" data-i18n="connecting">連線中…</p>
      <button id="wake-warning-toggle" class="warning-icon" type="button"
        data-i18n-aria="wakeWarningExpand" aria-label="展開螢幕鎖定警告"
        aria-expanded="false" hidden>⚠️</button>
    </div>
    <h1 id="slide">—</h1>
    <div class="panel-toggles">
      <button id="presentation-toggle" class="panel-toggle" type="button"
        data-i18n-aria="presentationPanelExpand" aria-label="展開選擇簡報面板"
        aria-expanded="false">📁</button>
      <button id="questions-toggle" class="panel-toggle" type="button"
        data-i18n-aria="questionsPanelExpand" aria-label="展開觀眾提問面板"
        aria-expanded="false">💬</button>
    </div>
  </header>
  <section id="wake-warning" class="warning" role="status" aria-live="polite" hidden><div><strong data-i18n="wakeTitle">⚠ 螢幕可能會自動鎖定</strong><p data-i18n="wakeText"></p><details><summary data-i18n="wakeSettings">查看設定路徑</summary><ul><li data-i18n="ios"></li><li data-i18n="android"></li></ul></details></div><button id="wake-retry" type="button" data-i18n="retryWake">重新啟用</button></section>
  <section id="voice-warning" class="warning" role="status" aria-live="polite" hidden>
    <div><strong data-i18n="voiceTitle">⚠ 手機未安裝中文語音</strong>
      <p data-i18n="voiceText"></p>
    </div>
    <button id="voice-dismiss" type="button" data-i18n="voiceDismiss">關閉提示</button>
  </section>
  <section class="primary-area" aria-label="Speaker notes and page controls">
    <section class="notes-panel">
      <div class="notes-toolbar" aria-label="Notes display controls">
        <button id="notes-decrease" type="button" data-i18n="fontDecrease" aria-label="Decrease notes text size">A−</button>
        <span data-i18n="fontSizeLabel">字級</span>
        <button id="notes-increase" type="button" data-i18n="fontIncrease" aria-label="Increase notes text size">A+</button>
        <div class="color-swatches" role="group" data-i18n-aria="colorLabel" aria-label="Notes text color">
          <button type="button" class="color-swatch color-white" data-note-color="#f9fafb" data-i18n-aria="colorWhite" aria-label="White"></button>
          <button type="button" class="color-swatch color-yellow" data-note-color="#fde047" data-i18n-aria="colorYellow" aria-label="Yellow"></button>
          <button type="button" class="color-swatch color-green" data-note-color="#4ade80" data-i18n-aria="colorGreen" aria-label="Green"></button>
          <button type="button" class="color-swatch color-red" data-note-color="#f87171" data-i18n-aria="colorRed" aria-label="Red"></button>
          <button type="button" class="color-swatch color-cyan" data-note-color="#67e8f9" data-i18n-aria="colorCyan" aria-label="Cyan"></button>
        </div>
      </div>
      <article id="notes" data-i18n="notFetched">尚未取得講稿</article>
    </section>
    <section id="video-panel" class="video-panel" aria-labelledby="video-label" hidden>
      <h2 id="video-label" data-i18n="videoPanelLabel">影片</h2>
      <div id="videos"></div>
    </section>
    <nav class="page-controls" aria-label="Page controls"><button id="prev" type="button" data-i18n="prev">◀ PREV</button><button id="next" type="button" data-i18n="next">NEXT ▶</button></nav>
  </section>
  <section class="secondary-area">
    <section class="presentation-picker" aria-labelledby="presentation-label" hidden>
      <h2 id="presentation-label" data-i18n="presentationLabel">選擇要控制的簡報</h2>
      <select id="presentation-select" aria-labelledby="presentation-label"></select>
    </section>
    <section class="questions-panel" aria-labelledby="questions-label" hidden>
      <h2 id="questions-label" data-i18n="questionsLabel">觀眾提問</h2>
      <ul id="questions" aria-live="polite"></ul>
    </section>
    <section class="presentation-controls" aria-label="Start presentation"><button id="start" type="button" data-i18n="start">▶ 開始簡報</button><button id="start-current" type="button" data-i18n="startCurrent">從目前頁開始</button></section>
    <div class="scene-controls">
      <button id="show-ask-qr" type="button" data-i18n="showAskQr">顯示提問 QR</button>
      <button id="back" type="button" data-i18n="back">↩ 回簡報</button>
    </div>
    <footer id="version"></footer>
  </section>
</main>
<script src="NoSleep.min.js?v=19"></script>
<script src="app.js?v=19"></script>
</body></html>

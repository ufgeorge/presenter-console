<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <title>Presenter Console</title>
</head>
<body>
  <main>
    <p id="status">連線中…</p>
    <h1 id="slide">—</h1>
    <section id="wake-warning" class="warning" hidden>
      <div>
        <strong>⚠ 螢幕可能會自動鎖定</strong>
        <p>請先點擊「重新啟用」；若仍無法保持亮著，請暫時關閉裝置的自動鎖定。</p>
        <details>
          <summary>查看設定路徑</summary>
          <ul>
            <li>iPhone/iPad：設定 → 螢幕顯示與亮度 → 自動鎖定 → 永不</li>
            <li>Android：設定 → 顯示 → 螢幕逾時／休眠 → 選擇較長時間</li>
          </ul>
        </details>
      </div>
      <button id="wake-retry" type="button">重新啟用</button>
    </section>
    <article id="notes">尚未取得講稿</article>
    <section class="presentation-controls" aria-label="開始簡報">
      <button id="start" type="button">▶ 開始簡報</button>
      <button id="start-current" type="button">從目前頁開始</button>
    </section>
    <button id="back" type="button">↩ 回簡報</button>
    <nav>
      <button id="prev" type="button">◀ PREV</button>
      <button id="next" type="button">NEXT ▶</button>
    </nav>
  </main>
  <script src="NoSleep.min.js"></script>
  <script src="app.js"></script>
</body>
</html>

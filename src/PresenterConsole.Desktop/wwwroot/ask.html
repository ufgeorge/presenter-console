<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="ask.css">
  <title>Presenter Console Q&A</title>
</head>
<body>
  <main>
    <h1 id="title">觀眾提問</h1>
    <p id="hint">請輸入想問講者的問題</p>
    <form id="ask-form">
      <textarea id="question" maxlength="200" required rows="7" aria-label="問題"></textarea>
      <button id="submit" type="submit">送出問題</button>
    </form>
    <p id="result" role="status" aria-live="polite"></p>
  </main>
  <script src="ask.js"></script>
</body>
</html>
